{% extends "base.html" %}
{% block content %}
<h1>Edit Provider</h1>
    <form action="{{ url_for('provider_page') }}" method="post">
        <input type="hidden" id="is_update" name="is_update" value="true">
        <div class="form-group">
            <div>Unique ID: {{provider['provider_id']}}</div>
            <input type="hidden" id="provider_id" name="provider_id" value="{{provider['provider_id']}}">
            <small id="uniqueid-help" class="form-text text-muted">*Cannot be updated</small>
        </div>
        <div class="form-group">
            <label for="first_name">First Name: </label>
            <input type="text" id="first_name" name="first_name" class="form-control" value="{{provider['first_name']}}">
        </div>
        <div class="form-group">
            <label for="last_name">Last Name: </label>
            <input type="text" id="last_name" name="last_name" class="form-control" value="{{provider['last_name']}}">
        </div>
        <div class="form-group">
            <label for="display_name">Display Name: </label>
            <input type="text" id="display_name" name="display_name" class="form-control" value="{{provider['display_name']}}">
        </div>
        <div class="form-group">
            <label for="is_active">Status: </label>
            <select id="is_active" name="is_active" class="form-control">
                <option value="True">Active</option>
                <option value="False" {% if provider['is_active'] == False %}selected{% endif %}>Inactive</option>
            </select></div>
        <input type="submit" class="btn btn-primary">
    </form>
{% endblock %}
