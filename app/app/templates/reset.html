{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block content %}
      <form id="login_form" action="/reset_password" method="post">
        <h2>Reset Password</h2>
          <div class="form-group">
        <label for="inputEmail">Email address</label>
        <input type="email" id="inputEmail" name="name"  placeholder="Email address to reset" class="form-control" required autofocus>
          </div>
        <button class="btn btn-primary" type="submit" id="reset_password">Reset Password</button>
      </form>
{% endblock %}
