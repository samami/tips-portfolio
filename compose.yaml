services:
  tips-app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      FIREBASE_WEB_CONFIG_PATH: /run/secrets/firebase-web-config.json
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets:ro
